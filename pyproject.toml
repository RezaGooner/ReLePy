[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "relepy"
dynamic = ["version"]
description = "ReLePy: a modular, well-tested reinforcement learning library with a simple fit/predict API."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Reza Asadi", email = "RezaAsadiProgrammer@Gmail.com" }]
keywords = ["reinforcement-learning", "rl", "dqn", "ppo", "a2c", "gymnasium", "pytorch"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.22",
    "gymnasium>=0.29",
]

[project.optional-dependencies]
torch = ["torch>=2.0"]
dev = ["pytest>=7", "pytest-cov", "ruff", "mypy", "build", "twine"]
all = ["relepy[torch,dev]"]

[project.urls]
Homepage = "https://github.com/RezaGooner/relepy"
Issues = "https://github.com/RezaGooner/relepy/issues"

[tool.hatch.version]
path = "src/relepy/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/relepy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not slow'"
markers = ["slow: long-running learning tests (run with: pytest -m slow)"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F"]

[tool.mypy]
python_version = "3.9"
ignore_missing_imports = true
warn_unused_ignores = true
